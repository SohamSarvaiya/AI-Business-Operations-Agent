services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: business_ops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/business_ops
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  pgdata:
